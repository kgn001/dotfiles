set -g mouse on
set -g history-limit 50000
set -g set-clipboard on

# vi key movement for copy/paste mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

bind r source-file $HOME/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# F12 makes the local tmux transparent so keys/mouse reach remote tmux
bind -T root F12 set prefix None \; set key-table off \; set -g status off \; refresh-client -S
bind -T off F12 set -u prefix \; set -u key-table \; set -g status on \; refresh-client -S
